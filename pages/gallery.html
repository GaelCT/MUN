<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>

    <div class="container">

                <br>
                <h3>CSUB MUN Delegates</h3>
            </div>
            <div class="cards">
                <img src="../images/dinner.jpg" alt="Dinner">

            </div>
            <div class="cards">
                <img src="../images/ElotePresent.jpg" alt="Elote Present">
                <br>

            </div>
            <div class="cards">
                <img src="../images/General.jpg" alt="General">
                <br>
                <h3>01/23/26 MUN General Meeting</h3>
            </div>
            <div class="cards">
                <img src="../images/image8.jpg" alt="Image 8">
                <br>
                <h3>Club Promotion Day</h3>
            </div>
            <div class="cards">

            </div>

                <br>
                <h3>Vice President Nayen explaining the differences between committees</h3>
            </div>
        </div>

    <script src="../scripts/script.js"></script>
