<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsletter</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/resources.css">
</head>

<body>
  <div id="navbar-placeholder"></div>

    <div>
  <iframe
    id="newsletter-pdf"
    src="../static/assets/newsletter.pdf"
    width="100%"
    height="800px">
</iframe>
    </div>

  <script src="../scripts/navbar.js"></script>
  <script src="../scripts/script.js"></script>
  <script>
    const newsletterPdf = document.getElementById('newsletter-pdf');
    const newsletterUrl = '../static/assets/newsletter.pdf';
    const newsletterVersionUrl = '../static/assets/newsletter-version.json';
    let newsletterVersion = null;

    async function refreshNewsletterWhenChanged() {
      try {
        const response = await fetch(newsletterVersionUrl, {
          cache: 'no-store'
        });
        if (!response.ok) {
          return;
        }

        const { version: nextVersion } = await response.json();
        if (!nextVersion) {
          return;
        }

        if (newsletterVersion && nextVersion !== newsletterVersion) {
          newsletterPdf.src = `${newsletterUrl}?version=${encodeURIComponent(nextVersion)}`;
        }

        newsletterVersion = nextVersion;
      } catch (error) {
        console.warn('Unable to check for a newsletter update.', error);
      }
    }

    refreshNewsletterWhenChanged();
    setInterval(refreshNewsletterWhenChanged, 5000);
  </script>
  </body>

</html>
